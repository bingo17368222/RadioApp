name: Build Chromaprint for Android

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-chromaprint.yml'
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        abi: [arm64-v8a] # 需要其他架构可加：armeabi-v7a, x86_64

    steps:
      - name: Checkout Chromaprint source
        uses: actions/checkout@v4
        with:
          repository: acoustid/chromaprint
          ref: v1.5.1
          path: chromaprint

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Checkout KissFFT source
        uses: actions/checkout@v4
        with:
          repository: mborgerding/kissfft
          ref: v130
          path: chromaprint/src/3rdparty/kissfft

      - name: Verify KissFFT checkout
        run: |
          echo "=== chromaprint/src/3rdparty/kissfft contents ==="
          ls -la chromaprint/src/3rdparty/kissfft || true
          echo "=== tools dir ==="
          ls -la chromaprint/src/3rdparty/kissfft/tools || true

      - name: Patch FindKissFFT for cross-compilation
        run: |
          sed -i 's/NO_DEFAULT_PATH/NO_DEFAULT_PATH NO_CMAKE_FIND_ROOT_PATH/' chromaprint/cmake/modules/FindKissFFT.cmake
          grep -A3 'find_path(KISSFFT_SOURCE_DIR' chromaprint/cmake/modules/FindKissFFT.cmake

      - name: Configure CMake
        run: |
          cmake -S chromaprint -B build_${{ matrix.abi }} \
            -DKISSFFT_ROOT=$PWD/chromaprint/src/3rdparty/kissfft \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-21 \
            -DFFT_LIB=kissfft \
            -DBUILD_TOOLS=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_${{ matrix.abi }} -j$(nproc)

      - name: Verify dependencies
        run: |
          echo "=== libchromaprint.so dependencies ==="
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d build_${{ matrix.abi }}/libchromaprint.so || true

      - name: Rename artifact
        run: cp build_${{ matrix.abi }}/libchromaprint.so libchromaprint-${{ matrix.abi }}.so

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chromaprint-latest
          name: "Chromaprint Android Build"
          body: "Auto-generated libchromaprint.so for Android (KissFFT, no FFmpeg, arm64-v8a, minSdk 21)"
          files: libchromaprint-${{ matrix.abi }}.so
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
