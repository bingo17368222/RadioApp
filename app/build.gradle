plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.radio.app'
    compileSdk 33
    buildToolsVersion "33.0.0"

    defaultConfig {
        applicationId "com.radio.app"
        minSdk 26
        targetSdk 33
        versionCode 671
        versionName "3.1.279"
        ndkVersion "25.1.8937393"

        // Issue 5: NDK / CMake support for whisper.cpp JNI bridge (whisper_jni.c)
        externalNativeBuild {
            cmake {
                cFlags "-DSTDC_HEADERS"
                cppFlags ""
            }
        }
        ndk {
            // v2.4.95: Only arm64-v8a to reduce APK size
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // v3.0.6: 使用 debug 签名构建 release 包，避免 APK 未签名导致无法安装
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        exclude 'lib/*/libvosk.so'
        exclude 'lib/*/libggml-base-whisper.so'
        exclude 'lib/*/libggml-cpu-whisper.so'
        exclude 'lib/*/libggml-whisper.so'
        exclude 'lib/*/libwhisper.so'
        exclude 'lib/*/libMNN_Vulkan.so'
        exclude 'lib/*/libMNN_CL.so'
        exclude 'lib/*/libMNNOpenCV.so'
        exclude 'lib/*/libMNNAudio.so'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/DEPENDENCIES'
    }

    // v3.1.65: 启用CMake编译chromaprint_jni，修复指纹库未加载问题
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "RadioApp-v${variant.versionName}.apk"
        }
    }
}

// =====================================================================
// [铁律 000 代码级硬校验] APK 单独交付（第一铁律，双保险之一）
// 与 AGENTS.md 铁律 000 互为双保险：每次 assembleRelease 自动运行本任务，
// 校验失败则构建失败，强制保证交付产物契约：
//   1. 构建产物自动复制到工作区根目录 /workspace/RadioApp-v<版本>.apk
//      （computer:// 链接的唯一来源，禁止交付其他产物）；
//   2. 发布页 releases/index.html 下载链接必须唯一且指向当前版本；
//   3. 输出唯一允许的交付链接模板（交付回复中必须仅含该一个可点击链接）。
// =====================================================================
tasks.register('verifyApkDelivery') {
    group = 'delivery'
    description = '[铁律000] APK单独交付硬校验: 复制APK到工作区根目录、校验发布页唯一链接、输出交付模板'
    doLast {
        def vName = android.defaultConfig.versionName
        def srcApk = new File(project.buildDir, "outputs/apk/release/RadioApp-v${vName}.apk")
        def rootApk = new File("/workspace/RadioApp-v${vName}.apk")

        // 1. 构建产物必须存在，并复制到工作区根目录
        if (!srcApk.exists()) {
            throw new GradleException("[铁律000] 构建产物缺失: ${srcApk.absolutePath}")
        }
        rootApk.parentFile.mkdirs()
        rootApk.bytes = srcApk.bytes
        if (!rootApk.exists() || rootApk.length() != srcApk.length()) {
            throw new GradleException("[铁律000] 复制交付APK到工作区根目录失败: ${rootApk.absolutePath}")
        }

        // 2. 发布页下载链接必须唯一且指向当前版本
        def indexHtml = new File(project.rootProject.projectDir, "releases/index.html")
        if (!indexHtml.exists()) {
            throw new GradleException("[铁律000] 发布页缺失: ${indexHtml.absolutePath}")
        }
        def html = indexHtml.getText("UTF-8")
        def hrefs = (html =~ /href="(RadioApp-v[^"]+\.apk)"/).collect { it[1] }
        if (hrefs.size() != 1 || hrefs[0] != "RadioApp-v${vName}.apk") {
            throw new GradleException("[铁律000] 发布页下载链接必须唯一且指向 RadioApp-v${vName}.apk，实际: ${hrefs}")
        }

        // 3. 输出唯一允许的交付链接模板
        println ""
        println "=== [铁律000] APK单独交付硬校验通过 ==="
        println "工作区根目录交付APK: ${rootApk.absolutePath}"
        println "发布页: ${indexHtml.absolutePath}"
        println "交付回复中唯一可点击链接必须为:"
        println "[下载安装](computer:///workspace/RadioApp-v${vName}.apk)"
        println "该链接必须是整条回复中唯一可点击链接，禁止混入任何其他链接。"
    }
}

// assembleRelease 完成后自动执行铁律000硬校验（硬门禁，校验失败即构建失败）
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease') {
        task.finalizedBy 'verifyApkDelivery'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-service:2.6.2'
    implementation 'androidx.media:media:1.6.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.16.3'
    implementation 'org.tensorflow:tensorflow-lite:2.15.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
}